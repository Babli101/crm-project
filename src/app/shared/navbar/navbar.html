<div class="lg:ml-64 bg-white/80 backdrop-blur shadow-sm px-4 md:px-6 py-4 flex items-center justify-between border-b">

  <!-- LEFT -->
  <div class="flex items-center gap-3">
    <button class="lg:hidden text-gray-700 text-2xl" (click)="toggleSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <h1 class="text-lg md:text-xl font-semibold text-gray-800 tracking-wide">
      CRM Dashboard
    </h1>
  </div>

  <!-- RIGHT -->
  <div class="flex items-center gap-6">

    <!-- 🔔 Notification Bell -->
    <div class="relative notification-wrapper">

      <!-- Bell -->
      <div 
        (click)="toggleDropdown()"
        class="relative cursor-pointer w-10 h-10 flex items-center justify-center rounded-full hover:bg-indigo-50 transition">

        <i class="fa-solid fa-bell text-lg text-gray-700 hover:text-indigo-600 transition"></i>

        <!-- Badge -->
        @if (unreadCount > 0) {
          <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] px-2 py-[2px] rounded-full shadow animate-ping"></span>

          <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-2 py-[2px] rounded-full shadow">
            {{unreadCount}}
          </span>
        }

      </div>

      <!-- Dropdown -->
      @if (showDropdown) {
        <div class="absolute right-0 mt-3 w-80 bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl border border-gray-100 z-50 overflow-hidden animate-fadeIn">

          <!-- Header -->
          <div class="p-4 border-b flex justify-between items-center bg-gradient-to-r from-indigo-50 to-blue-50">
            <span class="font-semibold text-gray-800">
              🔔 Today's Follow-ups
            </span>

            <button 
              (click)="unreadCount = 0; $event.stopPropagation()"
              class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
              Clear
            </button>
          </div>

          <!-- Empty -->
          @if (notifications.length === 0) {
            <div class="p-6 text-gray-400 text-center">
              <i class="fa-regular fa-bell-slash text-2xl mb-2"></i>
              <p>No follow-ups today</p>
            </div>
          }

          <!-- List -->
          @for (lead of notifications; track lead._id) {
            <div 
              (click)="openLead(lead._id); $event.stopPropagation()"
              class="p-4 border-b hover:bg-indigo-50 transition cursor-pointer group">

              <div class="flex justify-between items-center">

                <div>
                  <p class="font-medium text-gray-800 group-hover:text-indigo-600">
                    {{lead.name}}
                  </p>

                  <p class="text-xs text-gray-500 mt-1">
                    {{lead.followUpDate | date:'medium'}}
                  </p>
                </div>

                <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-indigo-600 text-xs"></i>

              </div>

            </div>
          }

        </div>
      }

    </div>

    <!-- Logout -->
    <button (click)="logout()"
      class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-4 py-2 rounded-xl text-sm shadow-md transition">
      Logout
    </button>

  </div>

</div>
