<app-sidebar></app-sidebar>
<app-navbar></app-navbar>

<div class="lg:ml-64 min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-4 md:p-6">
  <div class="max-w-3xl mx-auto">

    <!-- Header -->
    <div class="mb-6">
      <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Add Lead</h2>
      <p class="text-sm md:text-base text-gray-500 mt-1">
        Add a new lead to your CRM and manage it easily.
      </p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-5 md:p-8">
      <form (ngSubmit)="saveLead()" class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input
              [(ngModel)]="name"
              name="name"
              placeholder="Enter full name"
              class="w-full border border-gray-300 rounded-xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input
              [(ngModel)]="email"
              name="email"
              placeholder="Enter email address"
              class="w-full border border-gray-300 rounded-xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
          <div class="relative">
            <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input
              [(ngModel)]="phone"
              name="phone"
              placeholder="Enter phone number"
              class="w-full border border-gray-300 rounded-xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Company</label>
          <div class="relative">
            <i class="fa-solid fa-building absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input
              [(ngModel)]="company"
              name="company"
              placeholder="Enter company name"
              class="w-full border border-gray-300 rounded-xl pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
            />
          </div>
        </div>

        <div class="pt-2">
          <button
            class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium shadow-sm transition"
          >
            <i class="fa-solid fa-plus mr-2"></i>
            Add Lead
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
