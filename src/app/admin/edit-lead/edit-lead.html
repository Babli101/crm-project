<app-sidebar></app-sidebar>
<app-navbar></app-navbar>

<div class="lg:ml-64 min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-6">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <div>
      <h2 class="text-3xl font-bold text-gray-800">Edit Lead</h2>
      <p class="text-gray-500 mt-1">Manage lead details, follow-ups, and notes</p>
    </div>

    <!-- 🔷 MAIN GRID -->
    <div class="grid md:grid-cols-2 gap-6">

      <!-- LEFT: FORM -->
      <!-- LEFT: FORM -->
      <div class="bg-white rounded-2xl shadow-md border p-6 space-y-5">

        <h3 class="text-lg font-semibold text-gray-700">Lead Details</h3>

        <form (ngSubmit)="updateLead()" class="space-y-5">

          <!-- Name -->
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-3 text-gray-400"></i>
            <input [(ngModel)]="name" name="name" placeholder="Full Name"
              class="w-full pl-10 p-3 border rounded-xl focus:ring-2 focus:ring-blue-200 outline-none" />
          </div>

          <!-- Email -->
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3 top-3 text-gray-400"></i>
            <input [(ngModel)]="email" name="email" placeholder="Email"
              class="w-full pl-10 p-3 border rounded-xl focus:ring-2 focus:ring-blue-200 outline-none" />
          </div>

          <!-- Phone -->
          <div class="relative">
            <i class="fa-solid fa-phone absolute left-3 top-3 text-gray-400"></i>
            <input [(ngModel)]="phone" name="phone" placeholder="Phone"
              class="w-full pl-10 p-3 border rounded-xl focus:ring-2 focus:ring-blue-200 outline-none" />
          </div>

          <!-- Company -->
          <div class="relative">
            <i class="fa-solid fa-building absolute left-3 top-3 text-gray-400"></i>
            <input [(ngModel)]="company" name="company" placeholder="Company"
              class="w-full pl-10 p-3 border rounded-xl focus:ring-2 focus:ring-blue-200 outline-none" />
          </div>

          <!-- Status -->
          <select [(ngModel)]="status" name="status"
            class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-200 outline-none">
            <option value="New">New</option>
            <option value="Contacted">Contacted</option>
            <option value="Interested">Interested</option>
            <option value="Converted">Converted</option>
            <option value="Lost">Lost</option>
          </select>

          <!-- Buttons -->
          <div class="flex gap-3 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium">
              Update
            </button>

            <button type="button" routerLink="/leads"
              class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl">
              Back
            </button>
          </div>

        </form>
      </div>

      <!-- RIGHT: FOLLOW-UP -->
      <div class="bg-white rounded-2xl shadow-md border p-6 space-y-5">

        <h3 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
          <i class="fa-solid fa-calendar-check text-indigo-500"></i>
          Follow-up
        </h3>

        <input type="date" [(ngModel)]="followUpDate" [ngModelOptions]="{standalone: true}"
          class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-200 outline-none" />

        <button (click)="updateFollowUp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl">
          Save Follow-up
        </button>

        <!-- Notes -->
        <h3 class="text-lg font-semibold text-gray-700 mt-4 flex items-center gap-2">
          <i class="fa-solid fa-note-sticky text-blue-500"></i>
          Notes
        </h3>

        <textarea [(ngModel)]="noteText" [ngModelOptions]="{standalone: true}" placeholder="Write note..."
          class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-200 outline-none"></textarea>

        <button (click)="addNote()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl">
          Add Note
        </button>

      </div>

    </div>

    <!-- 🔥 NOTES HISTORY -->
    <div class="bg-white rounded-2xl shadow-md border p-6">

      <h3 class="text-lg font-semibold text-gray-700 mb-4">
        Notes Timeline
      </h3>

      <div *ngIf="notes.length === 0" class="text-gray-400 text-center py-6">
        No notes added yet
      </div>

      <div class="space-y-3">
        <div *ngFor="let note of notes" class="border-l-4 border-blue-500 bg-blue-50 p-4 rounded-lg">

          <p class="text-gray-800">{{note.text}}</p>

          <p class="text-xs text-gray-500 mt-1">
            {{note.createdAt | date:'medium'}}
          </p>
        </div>
      </div>

    </div>

  </div>
</div>
